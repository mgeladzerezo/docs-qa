name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers starts pgvector/pgvector:pg16; the default build uses a fake embedding model
      # and a scripted chat model, so it needs neither the ONNX model download nor an API key.
      - name: Build and test
        run: ./mvnw -B verify
      - name: Build the Docker image
        run: docker build -t docs-qa .
